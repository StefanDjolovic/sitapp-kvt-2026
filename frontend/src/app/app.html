<header class="app-header">
  <a class="app-brand" routerLink="/conversations" aria-label="SitApp početna strana">
    <span class="app-brand__mark" aria-hidden="true">S</span>
    <span>{{ title }}</span>
  </a>
  <nav class="app-nav" aria-label="Glavna navigacija">
    <a
      routerLink="/conversations"
      routerLinkActive="app-nav__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Razgovori
    </a>
    <a routerLink="/users/search" routerLinkActive="app-nav__link--active">Novi razgovor</a>
  </nav>
  <div class="app-header__context">
    <span class="app-header__user">Razvojni korisnik: {{ developmentUserName }}</span>
    <span class="app-header__project">KVT 2026</span>
  </div>
</header>

<router-outlet />
