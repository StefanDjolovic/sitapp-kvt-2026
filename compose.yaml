services:
  postgres:
    image: postgres:17-alpine
    container_name: sitapp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sitapp}
      POSTGRES_USER: ${POSTGRES_USER:-sitapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitapp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sitapp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sitapp-postgres-data:
