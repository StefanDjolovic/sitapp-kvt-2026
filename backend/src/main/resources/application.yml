spring:
  application:
    name: sitapp-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sitapp}
    username: ${DB_USERNAME:sitapp}
    password: ${DB_PASSWORD:sitapp}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
